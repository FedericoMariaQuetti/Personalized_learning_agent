name: Newsletter giornaliera

on:
  schedule:
    - cron: "*/5 * * * *"
    
permissions:
  contents: write

jobs:
  run-newsletter:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout del repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installa le dipendenze
        run: pip install -r requirements.txt

      - name: Esegui lo script della newsletter
        env:
          PYTHONUNBUFFERED: "1"
          LLM_PROVIDER: "gemini"
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
        run: python src/main.py

      - name: Salva nel repo lo stato, il log e gli eventuali resoconti generati
        run: |
          git config user.name "newsletter-bot"
          git config user.email "newsletter-bot@users.noreply.github.com"
          git add data/curriculum_state.json data/weekly_log.json reports/
          git diff --staged --quiet || git commit -m "Aggiornamento automatico newsletter [skip ci]"
          git push